    <style>
        body {
            background-color: #0f172a;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 24px 24px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        /* 3D Book Container Styling */
        .book-wrapper {
            perspective: 2000px;
        }

        .book-container {
            transform-style: preserve-3d;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Scrapbook Washi Tape Effect */
        .washi-tape {
            position: absolute;
            height: 26px;
            width: 100px;
            background-color: rgba(220, 213, 185, 0.7);
            backdrop-filter: blur(2px);
            border-left: 2px dashed rgba(0,0,0,0.1);
            border-right: 2px dashed rgba(0,0,0,0.1);
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            z-index: 20;
        }

        .tape-tl { top: -10px; left: 15px; transform: rotate(-6deg); }
        .tape-tr { top: -10px; right: 15px; transform: rotate(5deg); }
        .tape-bl { bottom: -10px; left: 15px; transform: rotate(4deg); }
        .tape-br { bottom: -10px; right: 15px; transform: rotate(-5deg); }

        /* Polaroid Frame Effect */
        .polaroid {
            background: #ffffff;
            padding: 10px 10px 28px 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
            transition: transform 0.3s ease;
        }

        .polaroid:hover {
            transform: scale(1.02) rotate(0deg) !important;
            z-index: 30;
        }

        /* Sticky Post-it Notes */
        .sticky-note {
            box-shadow: 3px 4px 12px rgba(0,0,0,0.12);
            font-family: 'Caveat', cursive;
            line-height: 1.25;
            position: relative;
        }

        /* Coffee Stain Accent */
        .coffee-stain {
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 5px solid rgba(139, 90, 43, 0.08);
            box-shadow: inset 0 0 10px rgba(139, 90, 43, 0.05);
            pointer-events: none;
        }

        /* Secrets Graduation Envelope */
        .envelope-container {
            perspective: 1000px;
            cursor: pointer;
        }

        .letter-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.6s ease-out, opacity 0.4s ease-in;
            opacity: 0;
        }

        .envelope-open .letter-content {
            max-height: 600px;
            opacity: 1;
        }
    </style>
</head>

        function initSound() {
            if (!synth && window.Tone) {
                synth = new Tone.NoiseSynth({
                    noise: { type: 'pink' },
                    envelope: { attack: 0.005, decay: 0.08, sustain: 0 }
                }).toDestination();
                synth.volume.value = -12;
            }
        }

        function playPageSound() {
            try {
                initSound();
                if (window.Tone && Tone.context.state !== 'running') {
                    Tone.start();
                }
                if (synth) synth.triggerAttackRelease("16n");
            } catch (e) {
                // Silently fallback if audio permissions are blocked
            }
        }

        // Countdown Clock Logic
        function updateCountdown() {
            const now = new Date().getTime();
            const diff = GRADUATION_DATE - now;

            if (diff <= 0) {
                document.getElementById("countdown-timer").innerText = "GRADUATION DAY IS HERE! 🎓✨";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("countdown-timer").innerText = days + "d " + hours + "h " + mins + "m " + secs + "s";
        }

                                '</div>' +
                            '</div>' +
                        '</div>' +
                        '<div class="sticky-note bg-postit-yellow p-4 rounded rotate-[2deg] text-slate-800 text-base font-bold">' +
                            '💬 "I tried" / "This MBA not easy" 😂<br>' +
                            '<span class="text-xs text-slate-600 block mt-2 font-sans font-normal">— Actual quotes from study marathons!</span>' +
                        '</div>' +
                    '</div>' +
                '</div>' +
                '<div class="bg-slate-900 text-amber-300 p-4 rounded-xl text-center font-bold text-sm shadow">' +
                    '"Hard days create strong stories. Look how far you\'ve come!" 💫' +
                '</div>' +
            '</div>',

            // PAGE 7: CHAPTER 8 - GRADUATION DAY
            '<div class="h-full flex flex-col justify-between">' +
                '<div>' +
                    '<div class="flex items-center justify-between border-b border-slate-200 pb-2 mb-3">' +
                        '<span class="text-xs font-bold text-amber-600 uppercase tracking-widest">Page 7 • The Finale</span>' +
                        '<span class="text-xs text-slate-400 font-mono">17th Nov 2026</span>' +
                    '</div>' +
                    '<div class="text-center mb-3">' +
                        '<h2 class="text-2xl font-black text-navy-800">Graduation Day 🎓</h2>' +
                        '<p class="text-xs text-slate-500">17th November 2026 • SAMS</p>' +
                    '</div>' +
                    '<div id="envelope-box" onclick="toggleEnvelope()" class="envelope-container max-w-md mx-auto bg-amber-50 p-4 rounded-2xl border-2 border-dashed border-amber-300 text-center shadow-md hover:shadow-lg transition">' +
                        '<div class="text-xs font-bold text-amber-800 uppercase tracking-widest mb-1">✉️ Click To Open Graduation Letter</div>' +
                        '<div class="text-[11px] text-amber-600 italic mb-2">Marked: "Open on Graduation Day"</div>' +
                        '<div class="letter-content text-left bg-white p-4 rounded-xl border border-amber-200 text-xs text-slate-700 leading-relaxed shadow-inner">' +
                            '<p class="font-bold text-navy-800 mb-2">My Dearest Graduate,</p>' +
                            '<p class="mb-2">You officially did it! From the first class on September 25th, 2025, through every Python script, finance model, and late-night study session — you proved your dedication and strength.</p>' +
                            '<p class="mb-2">An MBA in Finance, Big Data & FinTech is no small feat, but you handled it with brilliance. I am beyond proud of the leader and person you are today.</p>' +
                            '<p class="font-bold text-right text-amber-900 mt-3">— With all my love & admiration ❤️</p>' +
                        '</div>' +
                    '</div>' +
                '</div>' +
                '<div class="polaroid mx-auto rotate-[-1deg] max-w-[220px]">' +
                    '<div class="w-full h-28 bg-slate-100 flex flex-col items-center justify-center p-2 text-center rounded border border-slate-200">' +
                        '<span class="text-3xl mb-1">🎓🏆</span>' +
                        '<span class="text-[10px] text-slate-500 font-bold">Graduation Photo & Certificate</span>' +
                    '</div>' +
                    '<div class="font-hand text-sm font-bold text-slate-800 mt-2 text-center">"He Did It!"</div>' +
                '</div>' +
            '</div>'
        ];

        function renderPage() {
            const container = document.getElementById("page-content");
            container.innerHTML = pages[currentPage];

            document.getElementById("page-number-display").innerText = "Page " + (currentPage + 1) + " of " + pages.length;

            document.getElementById("prev-btn").disabled = (currentPage === 0);
            document.getElementById("next-btn").disabled = (currentPage === pages.length - 1);

            const tabs = document.querySelectorAll(".nav-tab");
            tabs.forEach((tab, index) => {
                if (index === currentPage) {
                    tab.classList.remove("bg-slate-800", "text-slate-300");
                    tab.classList.add("bg-amber-500", "text-slate-950", "font-extrabold");
                } else {
                    tab.classList.remove("bg-amber-500", "text-slate-950", "font-extrabold");
                    tab.classList.add("bg-slate-800", "text-slate-300");
                }
            });
        }

        function nextPage() {
            if (currentPage < pages.length - 1) {
                currentPage++;
                playPageSound();
                renderPage();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                playPageSound();
                renderPage();
            }
        }

        function goToPage(index) {
            if (index >= 0 && index < pages.length) {
                currentPage = index;
                playPageSound();
                renderPage();
            }
        }

        function toggleEnvelope() {
            const env = document.getElementById("envelope-box");
            if (env) {
                env.classList.toggle("envelope-open");
                playPageSound();
            }
        }

        document.addEventListener("keydown", function(e) {
            if (e.key === "ArrowRight") {
                nextPage();
            } else if (e.key === "ArrowLeft") {
                prevPage();
            }
        });

        renderPage();
    </script>
</body>
</html>
