<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeremi's MBA Journey | An Interactive Scrapbook</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js for tactile sound effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            800: '#1e3a8a',
                            900: '#0f172a',
                        },
                        paper: '#fcfbf7',
                        tape: 'rgba(225, 218, 195, 0.7)',
                        postit: {
                            yellow: '#fef08a',
                            pink: '#fbcfe8',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        hand: ['Caveat', 'cursive'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0f172a;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 24px 24px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        .book-wrapper {
            perspective: 2000px;
        }

        .book-container {
            transform-style: preserve-3d;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .cover-3d-card {
            transform-style: preserve-3d;
            transition: transform 0.2s cubic-bezier(0.1, 0.8, 0.2, 1), box-shadow 0.3s ease;
            background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(245, 158, 11, 0.3);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .cover-art-container {
            transform: translateZ(30px);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, rgba(30, 58, 138, 0.3) 100%);
        }

        .cover-enhanced-img {
            filter: contrast(115%) saturate(130%) brightness(102%);
            transition: filter 0.4s ease, transform 0.5s ease;
        }

        .cover-art-container:hover .cover-enhanced-img {
            filter: contrast(120%) saturate(140%) brightness(105%);
        }

        .cover-badge-float-1 {
            animation: floatGently 4s ease-in-out infinite;
            transform: translateZ(45px);
        }

        .cover-badge-float-2 {
            animation: floatGently 4.5s ease-in-out infinite reverse;
            transform: translateZ(50px);
        }

        @keyframes floatGently {
            0%, 100% { transform: translateZ(45px) translateY(0px) rotate(-2deg); }
            50% { transform: translateZ(45px) translateY(-8px) rotate(2deg); }
        }

        @keyframes shimmerGlow {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes expandWidth {
            from { width: 0; }
            to { width: 100%; }
        }

        .animated-underline {
            animation: expandWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .shimmer-text {
            background: linear-gradient(90deg, #fbbf24 0%, #fef08a 50%, #f59e0b 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            animation: shimmerGlow 5s linear infinite;
        }

        .washi-tape {
            position: absolute;
            height: 26px;
            width: 100px;
            background-color: rgba(220, 213, 185, 0.7);
            backdrop-filter: blur(2px);
            border-left: 2px dashed rgba(0,0,0,0.1);
            border-right: 2px dashed rgba(0,0,0,0.1);
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            z-index: 20;
        }

        .tape-tl { top: -10px; left: 15px; transform: rotate(-6deg); }
        .tape-tr { top: -10px; right: 15px; transform: rotate(5deg); }
        .tape-bl { bottom: -10px; left: 15px; transform: rotate(4deg); }
        .tape-br { bottom: -10px; right: 15px; transform: rotate(-5deg); }

        .polaroid {
            background: #ffffff;
            padding: 8px 8px 20px 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
            transition: transform 0.3s ease;
        }

        .polaroid:hover {
            transform: scale(1.03) rotate(0deg) !important;
            z-index: 30;
        }

        .sticky-note {
            box-shadow: 3px 4px 12px rgba(0,0,0,0.12);
            font-family: 'Caveat', cursive;
            line-height: 1.25;
            position: relative;
        }

        .interactive-img {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            cursor: pointer;
        }
        .interactive-img:hover {
            transform: scale(1.04) rotate(0deg) translateY(-4px) !important;
            box-shadow: 0 12px 25px -5px rgba(0, 0, 0, 0.25);
            z-index: 25;
        }

        .img-modal {
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .img-modal.open {
            opacity: 1;
            visibility: visible;
        }

        .coffee-stain {
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 5px solid rgba(139, 90, 43, 0.08);
            box-shadow: inset 0 0 10px rgba(139, 90, 43, 0.05);
            pointer-events: none;
        }

        .envelope-container {
            perspective: 1000px;
            cursor: pointer;
        }

        .letter-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.6s ease-out, opacity 0.4s ease-in;
            opacity: 0;
        }

        .envelope-open .letter-content {
            max-height: 600px;
            opacity: 1;
        }

        .module-tab-btn {
            transition: all 0.25s ease;
        }
        .module-tab-btn.active {
            background-color: #1e3a8a;
            color: #ffffff;
            border-color: #1e3a8a;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.25);
        }


        /* WEEKLY PAGE LOCKS */
        .nav-locked {
            opacity: 0.68;
            filter: grayscale(0.35);
            cursor: pointer;
            position: relative;
        }

        .nav-locked::after {
            content: "  🔒";
        }

        .lock-shake {
            animation: lockShake 0.45s ease;
        }

        @keyframes lockShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .lock-popup {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .lock-popup-card {
            background: #fef08a;
            max-width: 390px;
            width: 100%;
            padding: 26px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            transform: rotate(-1deg);
            border: 2px solid rgba(217, 119, 6, 0.25);
        }

        .lock-popup-card h3 {
            font-family: 'Caveat', cursive;
            font-size: 30px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .lock-popup-card p {
            color: #475569;
            font-size: 14px;
            line-height: 1.5;
        }

        .lock-popup-card button {
            margin-top: 18px;
            background: #1e3a8a;
            color: white;
            padding: 9px 22px;
            border-radius: 999px;
            font-weight: 700;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between p-2 md:p-6">

    <header class="max-w-6xl w-full mx-auto flex flex-col sm:flex-row items-center justify-between pb-4 border-b border-slate-800/80 gap-3">
        <div class="flex items-center gap-3">
            <img src="sams-logo.png" alt="SAMS Logo" class="h-10 w-auto object-contain" onerror="this.onerror=null; this.outerHTML='<div class=\'bg-blue-900 text-amber-400 font-extrabold px-3 py-1.5 rounded-lg text-sm tracking-wider border border-amber-400/30\'>SAMS MBA</div>';">
            <div>
                <h1 class="text-xl md:text-2xl font-extrabold text-white tracking-tight">Jeremi's MBA Journey</h1>
                <p class="text-xs text-slate-400">Finance, Big Data & FinTech | 2025–2026</p>
            </div>
        </div>

        <div class="bg-slate-800/90 border border-slate-700/80 rounded-xl px-4 py-2 flex items-center gap-3 text-white shadow-lg">
            <span class="text-xl">🎓</span>
            <div>
                <div class="text-[10px] text-amber-400 uppercase tracking-widest font-bold">Graduation Countdown</div>
                <div id="countdown-timer" class="text-sm md:text-base font-extrabold font-mono text-slate-100">Calculating...</div>
            </div>
        </div>
    </header>

    <nav class="max-w-5xl w-full mx-auto my-3 overflow-x-auto pb-2 scrollbar-none">
        <div class="flex items-center justify-center min-w-max gap-1.5 md:gap-2">
            <button onclick="goToPage(0)" class="nav-tab bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 text-xs px-3 py-1.5 rounded-full border border-amber-500/40 transition">Cover</button>
            <button onclick="goToPage(1)" class="nav-tab bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-full border border-slate-700 transition">1. Dedication</button>
            <button onclick="goToPage(2)" class="nav-tab bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-full border border-slate-700 transition">2. Decision</button>
            <button onclick="goToPage(3)" class="nav-tab bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-full border border-slate-700 transition">3. Trimester 1</button>
            <button id="nav-page-4" onclick="tryOpenPage(4, this)" class="nav-tab bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-full border border-slate-700 transition">4. Trimester 2</button>
            <button id="nav-page-5" onclick="tryOpenPage(5, this)" class="nav-tab bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-full border border-slate-700 transition">5. Trimester 3</button>
            <button id="nav-page-6" onclick="tryOpenPage(6, this)" class="nav-tab bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-full border border-slate-700 transition">6. Little Things in Between</button>
            <button id="nav-page-7" onclick="tryOpenPage(7, this)" class="nav-tab bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-full border border-slate-700 transition">7. Graduation</button>
        </div>
    </nav>

    <main class="book-wrapper flex-1 flex items-center justify-center my-2 max-w-5xl w-full mx-auto">
        <div id="book" class="book-container relative w-full bg-paper rounded-2xl min-h-[580px] md:min-h-[620px] flex flex-col justify-between p-4 md:p-8 border border-slate-200 overflow-hidden">
            <div class="coffee-stain top-8 right-12"></div>
            <div id="page-content" class="w-full h-full flex-1"></div>

            <footer class="mt-6 pt-4 border-t border-slate-200/80 flex items-center justify-between text-xs text-slate-500">
                <button onclick="prevPage()" id="prev-btn" class="flex items-center gap-1.5 px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold transition disabled:opacity-30 disabled:cursor-not-allowed">
                    ← Previous
                </button>

                <div class="flex items-center gap-2">
                    <span id="page-number-display" class="font-mono font-bold text-slate-700">Page 1 of 8</span>
                    <span class="hidden md:inline text-slate-400">| Use ← → Arrow Keys</span>
                </div>

                <button onclick="nextPage()" id="next-btn" class="flex items-center gap-1.5 px-4 py-2 rounded-lg bg-navy-800 hover:bg-blue-900 text-white font-bold transition disabled:opacity-30 disabled:cursor-not-allowed">
                    Next Page →
                </button>
            </footer>
        </div>
    </main>

    <!-- Interactive Image Modal Lightbox -->
    <div id="image-modal" class="img-modal fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 opacity-0 invisible" onclick="closeImageModal()">
        <div class="relative max-w-3xl w-full bg-white p-3 md:p-5 rounded-2xl shadow-2xl transition-transform duration-300 transform scale-95" id="modal-container" onclick="event.stopPropagation()">
            <button onclick="closeImageModal()" class="absolute -top-3 -right-3 bg-red-500 hover:bg-red-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold shadow-lg transition">✕</button>
            <img id="modal-img" src="" alt="Enlarged View" class="w-full max-h-[75vh] object-contain rounded-xl">
            <p id="modal-caption" class="text-center font-hand text-xl font-bold text-slate-800 mt-3"></p>
        </div>
    </div>

    <script>
        const GRADUATION_DATE = new Date("November 17, 2026 00:00:00").getTime();

        // WEEKLY PAGE RELEASE DATES
        // Change only these dates whenever you want to adjust the rollout.
        const PAGE_RELEASE_DATES = {
            4: new Date("October 31, 2026 00:00:00").getTime(),
            5: new Date("November 7, 2026 00:00:00").getTime(),
            6: new Date("November 14, 2026 00:00:00").getTime(),
            7: new Date("November 17, 2026 00:00:00").getTime()
        };

        const PAGE_LOCK_MESSAGES = {
            4: "Trimester 2 is still developing... come back soon 👀",
            5: "The story is not ready to enter the deep end just yet 🔐",
            6: "The little things are still being collected 💌",
            7: "Graduation is close... but not close enough. Doh rush de ting! 🎓"
        };
        let currentPage = 0;
        let activeTri1Tab = 'mkt'; // Default active module tab for Page 3 ('mkt', 'fin', 'pm')
        let pmSubView = 'grid'; // Sub-view mode for PM module ('grid', 'timeline', 'spotlight')

        let synth;
        function initSound() {
            if (!synth && window.Tone) {
                synth = new Tone.NoiseSynth({
                    noise: { type: 'pink' },
                    envelope: { attack: 0.005, decay: 0.08, sustain: 0 }
                }).toDestination();
                synth.volume.value = -12;
            }
        }

        function playPageSound() {
            try {
                initSound();
                if (window.Tone && Tone.context.state !== 'running') {
                    Tone.start();
                }
                if (synth) synth.triggerAttackRelease("16n");
            } catch (e) {}
        }

        function updateCountdown() {
            const now = new Date().getTime();
            const diff = GRADUATION_DATE - now;

            if (diff <= 0) {
                document.getElementById("countdown-timer").innerText = "GRADUATION DAY IS HERE! 🎓✨";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("countdown-timer").innerText = days + "d " + hours + "h " + mins + "m " + secs + "s";
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        function setTri1Tab(tabId) {
            activeTri1Tab = tabId;
            playPageSound();
            renderPage();
        }

        function setPmView(viewMode) {
            pmSubView = viewMode;
            playPageSound();
            renderPage();
        }

        function openImageModal(imgSrc, captionText) {
            const modal = document.getElementById("image-modal");
            const modalImg = document.getElementById("modal-img");
            const modalCaption = document.getElementById("modal-caption");
            
            if (modal && modalImg) {
                modalImg.src = imgSrc;
                if (modalCaption) modalCaption.innerText = captionText || "";
                modal.classList.add("open");
                playPageSound();
            }
        }

        function closeImageModal() {
            const modal = document.getElementById("image-modal");
            if (modal) {
                modal.classList.remove("open");
            }
        }

        function isPageUnlocked(pageIndex) {
            const releaseDate = PAGE_RELEASE_DATES[pageIndex];
            return !releaseDate || Date.now() >= releaseDate;
        }

        function formatReleaseDate(timestamp) {
            return new Date(timestamp).toLocaleDateString("en-TT", {
                day: "numeric",
                month: "long",
                year: "numeric"
            });
        }

        function closeLockPopup() {
            const popup = document.getElementById("lock-popup");
            if (popup) popup.remove();
        }

        function showLockMessage(message, releaseDate, titleText) {
            closeLockPopup();

            const popup = document.createElement("div");
            popup.id = "lock-popup";
            popup.className = "lock-popup";
            popup.innerHTML =
                '<div class="lock-popup-card">' +
                    '<div class="text-4xl mb-2">🔒</div>' +
                    '<h3>' + (titleText || "Not yet, babes!") + '</h3>' +
                    '<p>' + message + '</p>' +
                    (releaseDate ? '<p class="font-bold mt-3">Unlocks ' + formatReleaseDate(releaseDate) + '</p>' : '') +
                    '<button type="button" onclick="closeLockPopup()">Okay, okay 😂</button>' +
                '</div>';

            popup.addEventListener("click", function(event) {
                if (event.target === popup) closeLockPopup();
            });

            document.body.appendChild(popup);
            playPageSound();
        }

        function tryOpenPage(pageIndex, buttonElement) {
            if (isPageUnlocked(pageIndex)) {
                goToPage(pageIndex);
                return;
            }

            if (buttonElement) {
                buttonElement.classList.remove("lock-shake");
                void buttonElement.offsetWidth;
                buttonElement.classList.add("lock-shake");
            }

            showLockMessage(
                PAGE_LOCK_MESSAGES[pageIndex],
                PAGE_RELEASE_DATES[pageIndex],
                "Not yet, babes!"
            );
        }

        function updateLockedNavigation() {
            Object.keys(PAGE_RELEASE_DATES).forEach(function(pageNumber) {
                const pageIndex = Number(pageNumber);
                const button = document.getElementById("nav-page-" + pageNumber);
                if (!button) return;

                if (isPageUnlocked(pageIndex)) {
                    button.classList.remove("nav-locked");
                    button.title = "Open page";
                } else {
                    button.classList.add("nav-locked");
                    button.title = "Unlocks " + formatReleaseDate(PAGE_RELEASE_DATES[pageIndex]);
                }
            });
        }

        function getPages() {
            return [
            // PAGE 0: COVER
            '' +
            '<div class="h-full flex flex-col justify-center items-center text-center py-2 px-1 relative overflow-hidden" onmousemove="handleCoverTilt(event)" onmouseleave="resetCoverTilt()">' +
                '<div class="absolute inset-0 bg-gradient-to-tr from-amber-500/20 via-indigo-600/20 to-blue-500/20 blur-3xl pointer-events-none"></div>' +
                '<div id="cover-card" class="cover-3d-card relative max-w-xl w-full p-6 md:p-8 rounded-3xl my-auto text-white">' +
                    '<div class="washi-tape tape-tl"></div>' +
                    '<div class="washi-tape tape-tr"></div>' +
                    '<div class="washi-tape tape-bl"></div>' +
                    '<div class="washi-tape tape-br"></div>' +
                    '<div class="cover-badge-float-1 absolute -top-4 -left-3 bg-gradient-to-r from-amber-400 to-amber-600 text-slate-950 font-black text-[10px] md:text-xs px-4 py-1.5 rounded-full shadow-2xl border border-amber-200 uppercase tracking-widest flex items-center gap-1.5 z-30">' +
                        '✨ SAMS MBA MEMORIES' +
                    '</div>' +
                    '<div class="cover-badge-float-2 absolute -bottom-3 -right-2 bg-slate-900/95 text-amber-300 font-extrabold text-[10px] md:text-xs px-4 py-1.5 rounded-full shadow-2xl border border-amber-400/50 z-30 flex items-center gap-1.5 backdrop-blur-md">' +
                        '🎓 CLASS OF 2025–2026' +
                    '</div>' +
                    '<div class="mb-3 relative inline-block">' +
                        '<h1 class="text-3xl md:text-5xl font-black tracking-tight mb-1 shimmer-text drop-shadow-md">MBA Journey</h1>' +
                        '<div class="h-1 bg-gradient-to-r from-amber-400 via-amber-200 to-amber-500 rounded-full mx-auto mt-1.5 animated-underline"></div>' +
                        '<div class="flex items-center justify-center gap-2 text-xs md:text-sm font-extrabold text-amber-200/90 uppercase tracking-widest mt-2">' +
                            '<span class="h-2 w-2 rounded-full bg-amber-400 inline-block animate-ping"></span>' +
                            'Finance • Big Data • FinTech | SAMS' +
                        '</div>' +
                    '</div>' +
                    '<div class="cover-art-container my-4 max-w-[380px] md:max-w-[420px] mx-auto p-2.5 rounded-2xl border border-amber-400/30 interactive-img cursor-pointer" onclick="openImageModal(\'cap_road.jpg\', \'Jeremi\'s MBA Journey • The Climb to Graduation\')">' +
                        '<div class="w-full bg-slate-950 rounded-xl overflow-hidden flex items-center justify-center min-h-[260px] md:min-h-[300px] shadow-2xl relative border border-slate-800">' +
                            '<img src="cap_road.jpg" alt="Jeremi MBA Mountain Cover" class="cover-enhanced-img w-full h-auto max-h-[320px] md:max-h-[360px] object-contain transition-transform duration-500 hover:scale-105" onerror="this.onerror=null; this.outerHTML=\'<div class=&quot;p-8 text-center text-slate-400 font-bold text-xs&quot;><span class=&quot;text-4xl block mb-2&quot;>🎓⛰️</span>Upload cap_road.jpg to GitHub</div>\';">' +
                        '</div>' +
                    '</div>' +
                    '<div class="flex items-center justify-between max-w-[380px] mx-auto mt-4 pt-3 border-t border-slate-700/80 text-xs">' +
                        '<span class="font-hand text-xl md:text-2xl font-bold text-amber-300 drop-shadow">The Climb to Success 🚀</span>' +
                        '<button onclick="nextPage()" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 px-5 py-2 rounded-full font-extrabold shadow-lg hover:shadow-amber-500/20 transition transform hover:-translate-y-0.5 flex items-center gap-1.5 text-xs ring-2 ring-amber-300/50">' +
                            'Begin Journey →' +
                        '</button>' +
                    '</div>' +
                '</div>' +
            '</div>',

            // PAGE 1: DEDICATION
            '' +
            '<div class="h-full flex flex-col justify-between">' +
                '<div>' +
                    '<div class="flex items-center justify-between border-b border-slate-200 pb-2 mb-6">' +
                        '<span class="text-xs font-bold text-amber-600 uppercase tracking-widest">Page 1 • Prologue</span>' +
                        '<span class="text-xs text-slate-400 font-mono">Your MBA Journey at SAMS</span>' +

        function renderPage() {
            const container = document.getElementById("page-content");
            const pagesList = getPages();
            if (container) {
                container.innerHTML = pagesList[currentPage];
            }

            const pageDisplay = document.getElementById("page-number-display");
            if (pageDisplay) {
                pageDisplay.innerText = "Page " + (currentPage + 1) + " of " + pagesList.length;
            }

            const prevBtn = document.getElementById("prev-btn");
            const nextBtn = document.getElementById("next-btn");
            if (prevBtn) prevBtn.disabled = (currentPage === 0);
            if (nextBtn) nextBtn.disabled = (currentPage === pagesList.length - 1);

            const tabs = document.querySelectorAll(".nav-tab");
            tabs.forEach((tab, index) => {
                if (index === currentPage) {
                    tab.classList.remove("bg-slate-800", "text-slate-300");
                    tab.classList.add("bg-amber-500", "text-slate-950", "font-extrabold");
                } else {
                    tab.classList.remove("bg-amber-500", "text-slate-950", "font-extrabold");
                    tab.classList.add("bg-slate-800", "text-slate-300");
                }
            });

            updateLockedNavigation();
        }

        function nextPage() {
            const pagesList = getPages();
            const nextPageIndex = currentPage + 1;

            if (nextPageIndex >= pagesList.length) return;

            if (!isPageUnlocked(nextPageIndex)) {
                showLockMessage(
                    PAGE_LOCK_MESSAGES[nextPageIndex],
                    PAGE_RELEASE_DATES[nextPageIndex],
                    "Not yet, babes!"
                );
                return;
            }

            currentPage = nextPageIndex;
            playPageSound();
            renderPage();
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                playPageSound();
                renderPage();
            }
        }

        function goToPage(index) {
            const pagesList = getPages();

            if (index < 0 || index >= pagesList.length) return;

            if (!isPageUnlocked(index)) {
                showLockMessage(
                    PAGE_LOCK_MESSAGES[index],
                    PAGE_RELEASE_DATES[index],
                    "Not yet, babes!"
                );
                return;
            }

            currentPage = index;
            playPageSound();
            renderPage();
        }

        function toggleEnvelope() {
            if (Date.now() < GRADUATION_DATE) {
                showLockMessage(
                    "This letter is sealed until graduation day. Come back on 17 November 2026 🎓",
                    GRADUATION_DATE,
                    "DOH TRY THAT!"
                );
                return;
            }

            const env = document.getElementById("envelope-box");
            if (env) {
                env.classList.toggle("envelope-open");
                playPageSound();
            }
        }

        function handleCoverTilt(e) {
            const card = document.getElementById("cover-card");
            if (!card) return;
            
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = ((y - centerY) / centerY) * -10;
            const rotateY = ((x - centerX) / centerX) * 10;
            
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        }

        function resetCoverTilt() {
            const card = document.getElementById("cover-card");
            if (card) {
                card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
            }
        }

        document.addEventListener("keydown", function(e) {
            if (e.key === "ArrowRight") {
                nextPage();
            } else if (e.key === "ArrowLeft") {
                prevPage();
            }
        });

        window.onload = function() {
            renderPage();
            updateLockedNavigation();
        };
